name: Test build

# Every push to main: smoke-test the game, build the Windows
# installer + portable exe, and publish them as the rolling
# "test-build" pre-release. Pull requests get the test and build
# (downloadable from the run page) but do not publish.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke tests (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check Electron entry and legacy game
        run: for f in electron/main.js js/*.js; do node --check "$f" || exit 1; done
      - name: Build new engine
        run: npm run build:renderer
      - name: Install headless browser
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Legacy 0.14 game smoke test
        run: node tests/smoke-test.js
      - name: New engine smoke test
        run: node tests/engine-smoke-test.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: tests/screenshots/
          retention-days: 14

  build-windows:
    name: Build Windows installer
    needs: smoke-test
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Stamp build number
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$BASE.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build new engine
        run: npm run build:renderer
      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HormuzFleetCommand-windows
          path: |
            dist/HormuzFleetCommand-Setup.exe
            dist/HormuzFleetCommand.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish test-build release
    needs: build-windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HormuzFleetCommand-windows
          path: dist
      - name: Replace rolling test-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          cat > notes.md <<NOTES
          Automatic test build #${{ github.run_number }} from commit ${SHORT}.

          Latest commit: $(printf '%s' "$COMMIT_MSG" | head -1)

          - **HormuzFleetCommand-Setup.exe**: installer with Start Menu and desktop shortcuts
          - **HormuzFleetCommand.exe**: portable, no install, just double-click

          Windows may show a SmartScreen warning because the build is unsigned. Click "More info" and then "Run anyway".
          NOTES
          gh release create test-build dist/*.exe \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Test build #${{ github.run_number }} (${SHORT})" \
            --notes-file notes.md
